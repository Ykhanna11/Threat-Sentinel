name: threatsentinel-postgres-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: threatsentinel_test
      POSTGRES_USER: threatsentinel_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55432:5432"
    shm_size: 128mb
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
