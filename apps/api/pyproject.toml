[project]
name = "threat-sentinel-api"
version = "0.1.0"
description = "ThreatSentinel API foundation"
requires-python = ">=3.12,<4.0"
dependencies = [
    "alembic>=1.20.1,<2.0.0",
    "fastapi>=0.163.2,<1.0.0",
    "PyJWT[crypto]>=2.15.1,<3.0.0",
    "psycopg[binary]>=3.3.9,<4.0.0",
    "pydantic>=2.14.3,<3.0.0",
    "pydantic-settings>=2.16.3,<3.0.0",
    "sqlalchemy>=2.1.9,<3.0.0",
    "uvicorn>=0.54.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2,<3.0.0",
    "mypy>=2.4.1,<3.0.0",
    "pytest>=9.2.0,<10.0.0",
    "ruff>=0.17.5,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_sentinel_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "src/threat_sentinel_api/db/mixins.py",
    "src/threat_sentinel_api/db/model_registry.py",
    "src/threat_sentinel_api/db/types.py",
    "src/threat_sentinel_api/modules/identity",
    "src/threat_sentinel_api/modules/tenants",
]
