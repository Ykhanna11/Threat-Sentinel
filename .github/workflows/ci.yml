name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python scripts/validate_project.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:web

  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: threatsentinel_test
          POSTGRES_USER: threatsentinel_test
          POSTGRES_PASSWORD: integration-test-only
        options: >-
          --health-cmd "pg_isready -U threatsentinel_test -d threatsentinel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.9
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --project apps/api --locked --all-groups
      - run: uv run --directory apps/api --project . ruff check
      - run: uv run --directory apps/api --project . ruff format --check
      - run: uv run --directory apps/api --project . mypy
      - run: uv run --directory apps/api --project . pytest -m "not postgres_integration"
      - name: PostgreSQL integration tests
        env:
          THREAT_SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://threatsentinel_test:integration-test-only@postgres-test:5432/threatsentinel_test
        run: uv run --directory apps/api --project . pytest -m postgres_integration
